name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Le tag doit égaler la version du package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME ≠ v$VERSION (package.json)"; exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      # Le publisher intégré d'electron-builder (--publish always) a été vu sortir en succès
      # sans envoyer l'exe ni latest.yml (spec §8). On construit sans publier, puis gh publie
      # et un contrôle fait échouer le run si un des trois artefacts manque.
      - name: Build de l'installateur NSIS
        run: npx electron-builder --win --publish never
      - name: Publication de la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/Anka-Setup-*.exe dist/Anka-Setup-*.exe.blockmap dist/latest.yml
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Anka $GITHUB_REF_NAME" \
            --notes "Installateur Windows (NSIS). L'application installée se met à jour automatiquement depuis cette page." \
            --latest \
            dist/Anka-Setup-*.exe dist/Anka-Setup-*.exe.blockmap dist/latest.yml
      - name: Contrôle des artefacts publiés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft=\(.isDraft)", (.assets[] | .name)' | tee release-assets.txt
          grep -qx 'draft=false' release-assets.txt
          grep -q '\.exe$' release-assets.txt
          grep -q '\.exe\.blockmap$' release-assets.txt
          grep -qx 'latest.yml' release-assets.txt
