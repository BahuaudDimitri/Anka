appId: fr.anka.app
productName: Anka
copyright: MIT, Dimitri Bahuaud
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - nsis
  icon: resources/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  shortcutName: Anka
publish:
  provider: github
  owner: BahuaudDimitri
  repo: Anka
  releaseType: release
